<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ScanCanggih Mobile OCR</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tesseract.js & QRCode.js -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    :root {
      --bg-main: #0f172a; --card-bg: #1e293b; --primary: #3b82f6; --accent-green: #10b981; --text-main: #f8fafc; --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; padding: 16px; }
    .container { max-width: 420px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .card { background: var(--card-bg); border-radius: 16px; padding: 16px; border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; gap: 12px; }
    .card-title { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    
    .cam-box { background: rgba(59, 130, 246, 0.05); border: 2px dashed rgba(59, 130, 246, 0.3); border-radius: 14px; padding: 24px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .cam-icon { width: 50px; height: 50px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; color: white; font-size: 1.2rem; }
    
    .preview-img { display: none; width: 100%; max-height: 160px; object-fit: contain; border-radius: 8px; background: #000; }
    .btn { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
    .btn:disabled { opacity: 0.5; }
    
    textarea { width: 100%; height: 160px; background: rgba(15,23,42,0.6); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 10px; color: #e2e8f0; font-size: 0.85rem; resize: none; outline: none; }
    
    .qr-box { display: flex; flex-direction: column; align-items: center; background: rgba(15, 23, 42, 0.4); padding: 12px; border-radius: 12px; gap: 8px; }
    #qrcode img { border-radius: 8px; padding: 4px; background: white; }
    .progress-text { font-size: 0.75rem; color: var(--accent-green); text-align: center; font-weight: 600; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <div style="text-align:center; padding:6px 0;">
      <h1 style="font-size: 1.1rem; color: var(--primary);">ScanCanggih OCR</h1>
      <p style="font-size: 0.75rem; color: var(--text-muted);">Imbas kod QR atau ambil gambar dokumen</p>
    </div>

    <!-- Kotak QR Code -->
    <div class="card" id="qrCard">
      <div class="card-title">Kod QR Laman Web Ini</div>
      <div class="qr-box">
        <div id="qrcode"></div>
        <span style="font-size: 0.7rem; color: var(--text-muted); text-align: center;">Imbas kod ini menggunakan telefon untuk buka aplikasi terus.</span>
      </div>
    </div>

    <!-- Kamera / Ambil Gambar -->
    <div class="card">
      <div class="card-title">Kamera Pengimbas</div>
      <input type="file" id="camInput" accept="image/*" capture="environment" style="display:none;" onchange="previewFile(event)">
      <div class="cam-box" onclick="document.getElementById('camInput').click()">
        <div class="cam-icon"><i class="fa-solid fa-camera"></i></div>
        <span style="font-size:0.85rem; font-weight:600;">Ambil Gambar Dokumen</span>
      </div>

      <img id="preview" class="preview-img" alt="Pratonton">
      <div id="progText" class="progress-text">Sedang memproses OCR...</div>
      
      <button class="btn" id="btnSubmit" onclick="runOCRLocally()" disabled>
        <i class="fa-solid fa-bolt"></i> Mulakan Imbasan OCR
      </button>
    </div>

    <!-- Hasil Teks -->
    <div class="card">
      <div class="card-title">Hasil Teks Dokumen</div>
      <textarea id="txtResult" readonly placeholder="Hasil teks dokumen akan muncul di sini..."></textarea>
      <button class="btn" style="background: rgba(255,255,255,0.08);" onclick="copyText()"><i class="fa-solid fa-copy"></i> Salin Teks</button>
    </div>
  </div>

  <canvas id="canvasUtil" style="display:none;"></canvas>

  <script>
    let selectedFile = null;

    window.onload = function() {
      const currentUrl = window.location.href;
      if (currentUrl.startsWith('http')) {
        new QRCode(document.getElementById("qrcode"), {
          text: currentUrl,
          width: 120,
          height: 120
        });
      } else {
        document.getElementById('qrCard').style.display = 'none';
      }
    };

    function previewFile(e) {
      if (e.target.files.length > 0) {
        selectedFile = e.target.files[0];
        const preview = document.getElementById('preview');
        preview.src = URL.createObjectURL(selectedFile);
        preview.style.display = 'block';
        document.getElementById('btnSubmit').disabled = false;
      }
    }

    async function runOCRLocally() {
      if (!selectedFile) return;

      const btn = document.getElementById('btnSubmit');
      const txt = document.getElementById('txtResult');
      const prog = document.getElementById('progText');

      btn.disabled = true;
      prog.style.display = 'block';
      prog.innerText = "Mengoptimumkan imej...";
      txt.value = "Sila tunggu sebentar, sedang membaca teks daripada gambar...";

      try {
        // Mampatkan imej kepada lebar maksimum 800px supaya telefon tidak hang
        const reader = new FileReader();
        reader.onload = async function(e) {
          const img = new Image();
          img.onload = async function() {
            const canvas = document.getElementById('canvasUtil');
            const ctx = canvas.getContext('2d');
            let w = img.width, h = img.height;
            if (w > 800) { h = Math.round((h * 800) / w); w = 800; }
            canvas.width = w; canvas.height = h;
            ctx.drawImage(img, 0, 0, w, h);
            const optimizedData = canvas.toDataURL('image/jpeg', 0.7);

            prog.innerText = "Mengekstrak teks (OCR)...";

            // Jalankan Tesseract terus dalam pelayar tanpa pelayan luar
            const worker = await Tesseract.createWorker('eng+msa');
            const ret = await worker.recognize(optimizedData);
            await worker.terminate();

            const resultText = ret.data.text.trim();
            txt.value = resultText ? resultText : "Tiada teks dikesan pada dokumen ini.";
            
            prog.innerText = "Selesai!";
            btn.disabled = false;
            setTimeout(() => { prog.style.display = 'none'; }, 2000);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(selectedFile);

      } catch (err) {
        txt.value = "Ralat OCR: " + err.message;
        prog.style.display = 'none';
        btn.disabled = false;
      }
    }

    function copyText() {
      const txt = document.getElementById('txtResult');
      if (!txt.value) return;
      navigator.clipboard.writeText(txt.value).then(() => alert("Teks berjaya disalin!"));
    }
  </script>
</body>
</html>
